name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 12 * * 1'  # todos los lunes a las 12pm UTC
  workflow_dispatch:        # también lo podés correr a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "https://lxlxvmmpnqdkdneqtbma.supabase.co/rest/v1/properties?limit=1"
